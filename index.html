<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang web của tôi</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- Vị trí nhúng Header -->
    <div id="header-placeholder"></div>
    <div id="content"></div>
    <button id="genshin-deeplink-btn" onclick="openGenshin()">Mở Genshin Impact</button>
    <div id="device-info"></div>
    <div id="footer-placeholder"></div>
    

    <!-- Script nhúng nội dung -->
    <script src="JS/Router/router.js"></script>
    <script>
        function getOS() {
            const ua = navigator.userAgent;
            if (ua.includes("Windows")) return "Windows";
            if (ua.includes("Mac OS")) return "macOS";
            if (ua.includes("Android")) return "Android";
            if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
            if (ua.includes("Linux")) return "Linux";
            return "Không xác định";
        }

        function getBrowser() {
            const ua = navigator.userAgent;
            if (ua.includes("Edg/")) return "Edge";
            if (ua.includes("Chrome/") && !ua.includes("Edg/")) return "Chrome";
            if (ua.includes("Firefox/")) return "Firefox";
            if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
            return "Không xác định";
        }

        const el = document.getElementById('device-info');
        if (el) {
            el.innerText = `Hệ điều hành: ${getOS()} | Trình duyệt: ${getBrowser()}`;
        }



        function openGenshin() {
            const ua = navigator.userAgent || navigator.vendor;

            const iosUrl = "https://apps.apple.com/app/genshin-impact/id1517783697";
            const androidPackage = "com.miHoYo.GenshinImpact";
            const androidStoreUrl = "https://play.google.com/store/apps/details?id=" + androidPackage;
            const pcUrl = "https://genshin.hoyoverse.com/en/download";

            if (/android/i.test(ua)) {
                const intentUrl =
                "intent://#Intent;package=" + androidPackage +
                ";S.browser_fallback_url=" + encodeURIComponent(androidStoreUrl) +
                ";end";
                window.location.href = intentUrl;
            } else if (/iPad|iPhone|iPod/.test(ua)) {
                window.location.href = iosUrl;
            } else {
                window.location.href = pcUrl;
            }
        }

    </script>
</body>
</html>
