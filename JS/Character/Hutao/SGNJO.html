<script>
    // Function to show the appropriate date section based on today's date
    console.log('[HUTAO HTML] SCRIPT ĐÃ ĐƯỢC LOAD');
    function showDateSection() {
        const today = new Date();

        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const todayMD = `${month}-${day}`;

        console.log('[DATE] Hôm nay:', todayMD);

        const dateSections = document.querySelectorAll('.date-section');

        console.log('[DATE] Số section:', dateSections.length);

        // Ẩn TẤT CẢ section trước
        dateSections.forEach(section => {
            section.style.setProperty('display', 'none', 'important');
        });

        // Tìm event của hôm nay
        const matchedSection = document.querySelector(
            `.date-section[data-date="${todayMD}"]`
        );

        console.log('[DATE] Section hôm nay:', matchedSection);

        if (matchedSection) {

            // Có event -> hiện event
            matchedSection.style.setProperty('display', 'block', 'important');

            console.log('[EVENT] Đã kích hoạt:', todayMD);

            // Kiểm tra Default thực tế
            const defaultSection = document.querySelector(
                '.date-section[data-date="default"]'
            );

            if (defaultSection) {
                console.log(
                    '[DEFAULT] display sau khi ẩn:',
                    getComputedStyle(defaultSection).display
                );
            }

            return;
        }

        // Không có event -> hiện Default
        const defaultSection = document.querySelector(
            '.date-section[data-date="default"]'
        );

        if (defaultSection) {
            defaultSection.style.setProperty('display', 'block', 'important');

            console.log('[DEFAULT] Không có event, hiện Default');
        }
    }

    async function eventSN() {
        const slider = document.querySelector(".sn-section .image-slider");
        if (!slider) return;

        const folder = slider.dataset.folder;

        const res = await fetch(folder);
        const html = await res.text();

        const doc = new DOMParser().parseFromString(html, "text/html");

        const images = [...doc.querySelectorAll("a")]
            .map(a => a.getAttribute("href"))
            .filter(src => /\.(jpg|jpeg|png|webp|gif)$/i.test(src));

        if (!images.length) return;

        slider.innerHTML = `
            <div class="slider-track">
                ${images.map(src => `
                    <img src="${folder}${src}">
                `).join("")}

                <img src="${folder}${images[0]}">
            </div>
        `;

        const track = slider.querySelector(".slider-track");

        let index = 0;

        function next() {
            index++;
            track.style.transition = "transform .7s ease";
            track.style.transform = `translateX(-${index * 100}%)`;
        }

        track.addEventListener("transitionend", () => {
            if (index === images.length) {
                track.style.transition = "none";
                index = 0;
                track.style.transform = "translateX(0)";
            }
        });

        setInterval(next, 3000);
    }
    // Run the function when the page loads
    (async () => {
        showDateSection();
        eventSN();
    })();

    // Also run it when the date might have changed (e.g., if page is left open overnight)
    // This checks once per minute if we're at a new day
    setInterval(() => {
        const now = new Date();
        // Only check at midnight to avoid unnecessary checks
        if (now.getHours() === 0 && now.getMinutes() < 1) {
            showDateSection();
            // Also update banners at midnight
            loadCharacterData();
        }
    }, 60000); // Check every minute
</script>
