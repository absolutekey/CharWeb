<button id="genshin-deeplink-btn" onclick="openGenshin()">Mở Genshin Impact</button>

<script>

    function openGenshin() {
        const ua = navigator.userAgent || navigator.vendor;

        const iosUrl = "https://apps.apple.com/app/genshin-impact/id1517783697";
        const androidPackage = "com.miHoYo.GenshinImpact";
        const androidStoreUrl = "https://play.google.com/store/apps/details?id=" + androidPackage;
        const pcUrl = "https://genshin.hoyoverse.com/en/download";

        if (/android/i.test(ua)) {
            const intentUrl =
            "intent:#Intent;" +
            "action=android.intent.action.MAIN;" +
            "category=android.intent.category.LAUNCHER;" +
            "package=" + androidPackage + ";" +
            "S.browser_fallback_url=" + encodeURIComponent(androidStoreUrl) + ";" +
            "end";
            window.location.href = intentUrl;
        } else if (/iPad|iPhone|iPod/.test(ua)) {
            window.location.href = iosUrl;
        } else {
            window.location.href = pcUrl;
        }
        }

</script>
