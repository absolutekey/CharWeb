<h1>B</h1>
<div class="banner-active">Đang có sự kiện <span class="event-date"></span></div>
<div class="banner-upcoming">Sắp diễn ra <span class="event-date"></span></div>
<div class="layout-rieng-cho-nhan-vat-nay">    
    <button id="genshin-deeplink-btn" onclick="openGenshin()">Mở Genshin Impact</button>
</div>

<script>

    function openGenshin() {
        const ua = navigator.userAgent;

        const isAndroid = /Android/i.test(ua);
        const isIOS =
            /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        if (isIOS) {
            // iOS hiện không có deep link công khai
            window.location.href =
                "https://apps.apple.com/app/genshin-impact/id1517783697";
            return;
        }

        if (!isAndroid) {
            window.location.href =
                "https://genshin.hoyoverse.com/en/download";
            return;
        }

        // Các package phổ biến
        const packages = [
            "com.HoYoverse.GenshinImpact",
            "com.miHoYo.GenshinImpact",
            "com.miHoYo.Yuanshen"
        ];

        let opened = false;

        const onHidden = () => {
            opened = true;
            document.removeEventListener("visibilitychange", onHidden);
        };

        document.addEventListener("visibilitychange", onHidden);

        let index = 0;

        function tryNext() {

            if (opened) return;

            if (index >= packages.length) {

                setTimeout(() => {
                    if (!opened) {
                        window.location.href =
                            "https://genshin.hoyoverse.com/en/download";
                    }
                }, 500);

                return;
            }

            const pkg = packages[index++];

            const intent =
                "intent:#Intent;" +
                "action=android.intent.action.MAIN;" +
                "category=android.intent.category.LAUNCHER;" +
                "package=" + pkg + ";" +
                "end";

            location.href = intent;

            setTimeout(tryNext, 350);
        }

        tryNext();
    }
</script>
